[project]
name = "coding-agents-security-workshop"
version = "0.0.1"
description = "Coding-agent security workshop harness"
requires-python = ">=3.11"
dependencies = [
    "cryptography>=44,<47",
    "mcp>=2.1.1,<3",
]

[project.scripts]
ws = "ws.cli:main"
ws-rewrap = "ws.rewrap:main"
ws-hook-sink = "ws.hooks.sink_detect:main"
ws-mcp-email = "ws.mcp.email:main"
ws-acceptance = "ws.acceptance:main"

[dependency-groups]
dev = [
    "pytest>=9,<10",
    "ruff>=0.16,<0.17",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ws"]

[tool.pytest.ini_options]
addopts = "-m 'not integration'"
markers = [
    "integration: makes real CodeMie gateway calls; run by hand, never in CI",
]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
extend-select = ["I", "UP", "B"]
