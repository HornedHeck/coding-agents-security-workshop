[project]
name = "coding-agents-security-workshop"
version = "0.0.1"
description = "Coding-agent security workshop harness (PoC stage)"
requires-python = ">=3.11"
dependencies = [
    "cryptography>=44,<47",
]

[project.scripts]
ws-poc = "ws.poc:main"
ws-rewrap = "ws.rewrap:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ws"]
