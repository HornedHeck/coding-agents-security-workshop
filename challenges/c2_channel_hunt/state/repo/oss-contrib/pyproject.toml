[project]
name = "textkit"
version = "0.3.1"
description = "Tiny text helpers (slugs, truncation, word counts)"
requires-python = ">=3.9"
dependencies = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["textkit"]

